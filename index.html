<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الزراعة المائية الذكي</title>
  
  <link rel="stylesheet" href="css/style.css">
  <!-- FontAwesome & Chart.js & MQTT -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="logo-area">
      <i class="fa-solid fa-seedling"></i>
      <h2>مزرعتي الذكية</h2>
    </div>
    <div class="header-actions">
      <button id="btn-notifications-permission" onclick="requestNotificationPermission()" title="تفعيل الإشعارات">
        <i class="fa-regular fa-bell"></i>
      </button>
      <div id="global-status-tag" class="connection-tag offline">
        <i class="fa-solid fa-circle"></i> جاري الاتصال...
      </div>
    </div>
  </header>

  <main class="app-content">
    <!-- Tab 1: Dashboard -->
    <section id="tab-dashboard" class="page-tab active">
      <div class="tab-title">
        <h3>اللوحة الرئيسية</h3>
        <p>حالة البيئة الآن</p>
      </div>

      <div class="card mode-card">
        <div>
          <span class="card-label">وضع التشغيل</span>
          <div id="dash-mode-val" class="mode-status">تلقائي (AUTO)</div>
        </div>
        <div class="mode-btns">
          <button id="btn-mode-auto" class="btn-mode active" onclick="promptModeChange('AUTO')">AUTO</button>
          <button id="btn-mode-manual" class="btn-mode" onclick="promptModeChange('MANUAL')">MANUAL</button>
        </div>
      </div>

      <div class="cards-grid">
        <div class="card">
          <div class="card-header"><span>حرارة الهواء</span><i class="fa-solid fa-temperature-high"></i></div>
          <div id="dash-air-temp" class="card-value">-- <small>°C</small></div>
        </div>
        <div class="card">
          <div class="card-header"><span>رطوبة الهواء</span><i class="fa-solid fa-droplet"></i></div>
          <div id="dash-air-hum" class="card-value">-- <small>%</small></div>
        </div>
        <div class="card">
          <div class="card-header"><span>الحموضة pH</span><i class="fa-solid fa-flask"></i></div>
          <div id="dash-ph" class="card-value">--</div>
        </div>
        <div class="card">
          <div class="card-header"><span>الملوحة EC</span><i class="fa-solid fa-bolt"></i></div>
          <div id="dash-ec" class="card-value">-- <small>mS</small></div>
        </div>
      </div>
    </section>

    <!-- Tab 2: Monitoring -->
    <section id="tab-monitoring" class="page-tab">
      <div class="tab-title">
        <h3>المراقبة والرسوم</h3>
      </div>
      <div class="card chart-card">
        <h4>تغير الحرارة</h4>
        <canvas id="chart-temp"></canvas>
      </div>
    </section>

    <!-- Tab 3: Controls -->
    <section id="tab-controls" class="page-tab">
      <div class="tab-title">
        <h3>التحكم اليدوي</h3>
      </div>
      <div class="controls-list" id="manual-controls-group">
        <div class="control-item">
          <div class="control-info"><i class="fa-solid fa-pump-soap"></i> <strong>المضخة</strong></div>
          <label class="switch"><input type="checkbox" id="dev-pump" onchange="toggleDevice('pump', this.checked)"><span class="slider"></span></label>
        </div>
        <div class="control-item">
          <div class="control-info"><i class="fa-solid fa-fan"></i> <strong>المروحة</strong></div>
          <label class="switch"><input type="checkbox" id="dev-fan" onchange="toggleDevice('fan', this.checked)"><span class="slider"></span></label>
        </div>
      </div>
    </section>

    <!-- Tab 4: Menu -->
    <section id="tab-menu" class="page-tab">
      <div class="menu-grid">
        <button class="menu-card" onclick="openSubPage('sub-alerts')">
          <i class="fa-solid fa-bell"></i><span>التنبيهات</span>
        </button>
        <button class="menu-card" onclick="reconnectMQTT()">
          <i class="fa-solid fa-network-wired"></i><span>إعادة الاتصال</span>
        </button>
      </div>
    </section>
  </main>

  <!-- Navigation -->
  <nav class="app-nav">
    <button class="nav-item active" onclick="switchTab('tab-dashboard', this)"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
    <button class="nav-item" onclick="switchTab('tab-monitoring', this)"><i class="fa-solid fa-chart-line"></i><span>المراقبة</span></button>
    <button class="nav-item" onclick="switchTab('tab-controls', this)"><i class="fa-solid fa-toggle-on"></i><span>التحكم</span></button>
    <button class="nav-item" onclick="switchTab('tab-menu', this)"><i class="fa-solid fa-bars"></i><span>القائمة</span></button>
  </nav>

  <!-- Modals -->
  <div id="sub-page-modal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 id="modal-title"></h3><button class="btn-close" onclick="closeSubPage()">&times;</button></div>
    <div id="modal-body"></div>
  </div></div>

  <div id="mode-confirm-modal" class="modal"><div class="modal-content confirm-modal">
    <h3>تأكيد الوضع</h3><p id="mode-confirm-text"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="btn-confirm-action">تأكيد</button>
      <button class="btn-secondary" onclick="closeModeModal()">إلغاء</button>
    </div>
  </div></div>

  <script src="js/app.js"></script>
</body>
</html>
